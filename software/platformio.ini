; PlatformIO project for the 4-axis camera slider (ESP32-S3 N16R8).
;
; Pin map and mechanics live in the firmware's runtime config, not here --
; see include/config.h for the factory defaults and the web UI for editing
; them. This file only describes how the binary is built and flashed.

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB quad-SPI flash, 8MB octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; BLE HID (Blackmagic Camera record toggle). Set to 0 to drop the BLE
    ; stack entirely -- saves ~700kB of flash and removes any WiFi/BLE
    ; coexistence question if you do not use it.
    -DENABLE_BLE_HID=1
    ; ESPAsyncWebServer: keep the WebSocket queue short. Telemetry is
    ; re-sent every 150ms, so buffering stale frames for a slow client is
    ; worse than dropping them.
    -DWS_MAX_QUEUED_MESSAGES=8

lib_deps =
    gin66/FastAccelStepper @ ^0.31.4
    teemuatlut/TMCStepper @ ^0.7.3
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.2.0
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
