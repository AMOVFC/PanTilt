; PlatformIO project for the ORIGINAL PROTOTYPE build (3 axes: slide/pan/tilt,
; 3 TMC2209 breakout boards, 3 per-axis encoders, 2 AS5600s, slide limit
; switches only). See README.md in this folder for the written wiring
; diagram this targets.
;
; Sibling project to the parent folder's 4-axis build (../platformio.ini),
; not a variant of it -- kept as a separate PlatformIO root so there's no
; include-path ambiguity between this config.h and the final rig's. Same
; board, same framework, same library set; only the source differs.

[env:esp32-s3-prototype]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB quad-SPI flash, 8MB octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    gin66/FastAccelStepper @ ^0.31.4
    madhephaestus/ESP32Encoder @ ^0.11.7
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    teemuatlut/TMCStepper @ ^0.7.3
    bblanchon/ArduinoJson @ ^7.0.4
