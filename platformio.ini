; PlatformIO project for the 3-axis camera slider (ESP32-S3 N16R8)
; See hardware/final_wiring_diagram_v3.svg for the wiring this targets.

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB quad-SPI flash, 8MB octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    gin66/FastAccelStepper @ ^0.31.4
    madhephaestus/ESP32Encoder @ ^0.11.7
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
